<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heowz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #000;
            color: #fff;
            font-family: "Courier New", monospace;
            overflow-x: hidden;
        }

        /* =========================
           NỀN SAO
        ========================= */

        #stars {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            z-index: -5;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: blink 2s infinite alternate;
        }

        @keyframes blink {
            0% {
                opacity: .15;
            }

            100% {
                opacity: 1;
            }
        }

        /* =========================
           DẤU ?!
        ========================= */

        .question {
            position: fixed;
            color: white;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 48px;
            opacity: .35;
            z-index: -2;
            animation: floating 5s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .q1 {
            left: 7%;
            top: 30%;
        }

        .q2 {
            right: 10%;
            top: 20%;
        }

        .q3 {
            left: 3%;
            top: 55%;
        }

        .q4 {
            right: 25%;
            top: 70%;
        }

        .q5 {
            left: 42%;
            top: 42%;
        }

        /* =========================
           NÚT ÂM THANH
        ========================= */

        .sound-button {
            position: fixed;
            top: 18px;
            left: 18px;

            width: 58px;
            height: 58px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: rgba(10, 10, 10, .8);
            border-radius: 14px;

            cursor: pointer;
            z-index: 100;

            font-size: 27px;

            transition: .2s;
        }

        .sound-button:hover {
            transform: scale(1.08);
            background: rgba(30, 30, 30, .9);
        }

        /* =========================
           KHUNG CHÍNH
        ========================= */

        .container {
            width: 100%;
            max-width: 650px;

            margin: auto;

            padding: 70px 20px 60px;
        }

        /* =========================
           PROFILE
        ========================= */

        .profile {
            text-align: center;
        }

        .avatar {
            width: 155px;
            height: 155px;

            object-fit: cover;

            border-radius: 50%;

            border: 3px solid rgba(255,255,255,.25);

            box-shadow:
                0 0 15px rgba(255,255,255,.12),
                0 0 35px rgba(255,255,255,.08);

            display: block;

            margin: auto;
        }

        /* =========================
           SOCIAL ICON
        ========================= */

        .socials {
            margin-top: 14px;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 18px;
        }

        .socials a {
            width: 28px;
            height: 28px;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;

            text-decoration: none;

            transition: .2s;

            filter: drop-shadow(0 0 6px rgba(255,255,255,.7));
        }

        .socials a:hover {
            transform: scale(1.2);
        }

        .socials svg {
            width: 25px;
            height: 25px;
            fill: white;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            margin-top: 25px;

            background: rgba(5,5,5,.88);

            border-radius: 20px;

            overflow: hidden;

            border: 1px solid rgba(255,255,255,.05);

            box-shadow:
                0 0 30px rgba(255,255,255,.04);
        }

        /* =========================
           BANNER
        ========================= */

        .banner {
            width: 100%;
            height: 230px;

            object-fit: cover;

            display: block;
        }

        /* =========================
           THÔNG TIN
        ========================= */

        .info {
            display: flex;

            justify-content: flex-start;
            align-items: center;

            gap: 18px;

            padding: 12px 18px 4px;

            font-family: Arial, sans-serif;

            font-size: 14px;
        }

        .info span {
            opacity: .9;
        }

        /* =========================
           MUSIC
        ========================= */

        .music {
            display: flex;

            align-items: center;

            gap: 16px;

            padding: 18px;
        }

        .music-cover {
            width: 65px;
            height: 65px;

            object-fit: cover;

            border-radius: 8px;

            flex-shrink: 0;
        }

        .music-content {
            flex: 1;

            min-width: 0;
        }

        .song-name {
            font-size: 20px;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .time {
            display: flex;

            justify-content: space-between;

            font-family: Arial, sans-serif;

            font-size: 12px;

            opacity: .7;
        }

        /* =========================
           THANH NHẠC
        ========================= */

        .progress {
            width: 100%;

            height: 7px;

            background: #555;

            border-radius: 10px;

            margin-top: 5px;

            cursor: pointer;

            overflow: hidden;
        }

        .progress-bar {
            width: 0%;

            height: 100%;

            background: white;

            border-radius: 10px;

            transition: width .1s linear;
        }

        /* =========================
           NÚT PLAY
        ========================= */

        .play {
            width: 44px;
            height: 44px;

            flex-shrink: 0;

            border: none;

            border-radius: 50%;

            background: white;

            color: black;

            cursor: pointer;

            font-size: 16px;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .play:hover {
            transform: scale(1.08);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .container {
                padding-top: 85px;
            }

            .avatar {
                width: 125px;
                height: 125px;
            }

            .banner {
                height: 190px;
            }

            .music {
                gap: 10px;
                padding: 14px;
            }

            .music-cover {
                width: 55px;
                height: 55px;
            }

            .song-name {
                font-size: 17px;
            }

            .question {
                font-size: 35px;
            }
        }
    </style>
</head>


<body>

    <!-- =========================
         NỀN SAO
    ========================= -->

    <div id="stars"></div>


    <!-- =========================
         DẤU ?!
    ========================= -->

    <div class="question q1">?!</div>
    <div class="question q2">?!</div>
    <div class="question q3">?!</div>
    <div class="question q4">?!</div>
    <div class="question q5">?!</div>


    <!-- =========================
         NÚT ÂM THANH
    ========================= -->

    <div class="sound-button" onclick="toggleMusic()" id="soundButton">
        🔊
    </div>


    <!-- =========================
         NỘI DUNG
    ========================= -->

    <div class="container">


        <!-- =========================
             AVATAR
        ========================= -->

        <div class="profile">

            <!-- AVATAR CỦA BẠN -->
            <img
                class="avatar"
                src="avatar.png"
                alt="Avatar"
            >


            <!-- =========================
                 SOCIAL
            ========================= -->

            <div class="socials">

                <!-- DISCORD -->
                <a
                    href="https://discord.com/"
                    target="_blank"
                    aria-label="Discord"
                >

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                    >

                        <path d="M19.54 4.37A18.3 18.3 0 0 0 15.1 3l-.55 1.12a16.4 16.4 0 0 0-5.1 0L8.9 3a18.3 18.3 0 0 0-4.44 1.37C1.65 8.58.89 12.69 1.27 16.74A18.3 18.3 0 0 0 6.73 19l1.32-1.8c-.73-.27-1.43-.62-2.08-1.05l.5-.38c4.01 1.86 8.35 1.86 12.31 0l.5.38c-.65.43-1.35.78-2.08 1.05l1.32 1.8a18.3 18.3 0 0 0 5.46-2.26c.45-4.7-.77-8.77-4.44-12.37ZM8.02 14.32c-1.2 0-2.19-1.1-2.19-2.45s.97-2.45 2.19-2.45 2.2 1.1 2.19 2.45c0 1.35-.97 2.45-2.19 2.45Zm7.96 0c-1.2 0-2.19-1.1-2.19-2.45s.97-2.45 2.19-2.45 2.2 1.1 2.19 2.45c0 1.35-.97 2.45-2.19 2.45Z"/>

                    </svg>

                </a>


                <!-- TIKTOK -->
                <a
                    href="https://www.tiktok.com/@user._.heozw"
                    target="_blank"
                    aria-label="TikTok"
                >

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                    >

                        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-3.77A4.83 4.83 0 0 1 15.69 1h-3.55v14.4a2.89 2.89 0 1 1-2.89-2.89c.2 0 .4.02.59.06V9.01a6.45 6.45 0 0 0-.59-.03A6.42 6.42 0 1 0 15.67 15V8.27a8.36 8.36 0 0 0 4.92 1.59V6.31c-.34.38-.63.51-1 .38z"/>

                    </svg>

                </a>


                <!-- FACEBOOK -->
                <a
                    href="https://www.facebook.com/share/1DpMJnZysN/?mibextid=wwXIfr"
                    target="_blank"
                    aria-label="Facebook"
                >

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                    >

                        <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073c0 6.02 4.388 11.013 10.125 11.927v-8.432H7.078v-3.495h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.313 0 2.686.236 2.686.236v2.973h-1.514c-1.491 0-1.956.93-1.956 1.886v2.264h3.328l-.532 3.495h-2.796V24C19.612 23.086 24 18.093 24 12.073z"/>

                    </svg>

                </a>

            </div>

        </div>


        <!-- =========================
             CARD
        ========================= -->

        <div class="card">


            <!-- =========================
                 BANNER
            ========================= -->

            <img
                class="banner"
                src="banner.jpg"
                alt="Banner"
            >


            <!-- =========================
                 THÔNG TIN
            ========================= -->

            <div class="info">

                <span>
                    👁 1,414
                </span>

                <span>
                    📍 Đồng Nai
                </span>

            </div>


            <!-- =========================
                 MUSIC
            ========================= -->

            <div class="music">


                <!-- ẢNH NHẠC -->

                <img
                    class="music-cover"
                    src="music-cover.jpg"
                    alt="Music"
                >


                <div class="music-content">

                    <div class="song-name">
                        gia huy
                    </div>


                    <div class="time">

                        <span id="current">
                            0:00
                        </span>

                        <span id="duration">
                            0:00
                        </span>

                    </div>


                    <div
                        class="progress"
                        onclick="seek(event)"
                    >

                        <div
                            class="progress-bar"
                            id="bar"
                        ></div>

                    </div>

                </div>


                <!-- PLAY -->

                <button
                    class="play"
                    onclick="toggleMusic()"
                    id="play"
                >
                    ▶
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         FILE NHẠC
    ========================= -->

    <audio id="audio" src="music.mp3"></audio>


    <script>

        /* =========================
           TẠO SAO
        ========================= */

        const stars =
            document.getElementById("stars");

        for (let i = 0; i < 180; i++) {

            const star =
                document.createElement("div");

            star.className = "star";

            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";

            star.style.animationDelay =
                Math.random() * 3 + "s";

            stars.appendChild(star);
        }


        /* =========================
           MUSIC
        ========================= */

        const audio =
            document.getElementById("audio");

        const play =
            document.getElementById("play");

        const bar =
            document.getElementById("bar");

        const soundButton =
            document.getElementById("soundButton");


        function toggleMusic() {

            if (audio.paused) {

                audio.play();

                play.innerHTML = "❚❚";

                soundButton.innerHTML = "🔊";

            } else {

                audio.pause();

                play.innerHTML = "▶";

                soundButton.innerHTML = "🔇";
            }
        }


        /* =========================
           CẬP NHẬT THỜI GIAN
        ========================= */

        audio.addEventListener(
            "loadedmetadata",
            function () {

                document.getElementById(
                    "duration"
                ).innerText =
                    formatTime(audio.duration);

            }
        );


        audio.addEventListener(
            "timeupdate",
            function () {

                if (!audio.duration) {
                    return;
                }

                const percent =
                    (audio.currentTime /
                    audio.duration) * 100;

                bar.style.width =
                    percent + "%";


                document.getElementById(
                    "current"
                ).innerText =
                    formatTime(audio.currentTime);

            }
        );


        /* =========================
           FORMAT TIME
        ========================= */

        function formatTime(seconds) {

            let minutes =
                Math.floor(seconds / 60);

            let seconds2 =
                Math.floor(seconds % 60);

            if (seconds2 < 10) {
                seconds2 =
                    "0" + seconds2;
            }

            return minutes + ":" + seconds2;
        }


        /* =========================
           CLICK THANH NHẠC
        ========================= */

        function seek(event) {

            if (!audio.duration) {
                return;
            }

            const rect =
                event.currentTarget
                .getBoundingClientRect();

            const percent =
                (event.clientX - rect.left)
                / rect.width;

            audio.currentTime =
                percent * audio.duration;
        }


        /* =========================
           KHI NHẠC KẾT THÚC
        ========================= */

        audio.addEventListener(
            "ended",
            function () {

                play.innerHTML = "▶";

                soundButton.innerHTML = "🔇";

                bar.style.width = "0%";

            }
        );

    </script>

</body>
</html>
