<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gia Huy</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Nền */
#stars {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        radial-gradient(circle at center, #151515 0%, #050505 50%, #000 100%);
}

/* Sao */
.star {
    position: fixed;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: .7;
    animation: blink 2s infinite alternate;
}

@keyframes blink {
    from {
        opacity: .2;
    }
    to {
        opacity: 1;
    }
}

/* ?! */
.question {
    position: fixed;
    color: rgba(255,255,255,.35);
    font-size: 22px;
    font-weight: bold;
    z-index: -1;
    animation: floating 5s ease-in-out infinite;
}

.q1 {
    left: 8%;
    top: 20%;
}

.q2 {
    right: 10%;
    top: 25%;
    animation-delay: 1s;
}

.q3 {
    left: 12%;
    bottom: 20%;
    animation-delay: 2s;
}

.q4 {
    right: 15%;
    bottom: 25%;
    animation-delay: 3s;
}

@keyframes floating {
    0%,100% {
        transform: translateY(0) rotate(-5deg);
    }

    50% {
        transform: translateY(-15px) rotate(5deg);
    }
}

/* Nội dung */
.container {
    width: 100%;
    max-width: 550px;
    margin: auto;
    padding-top: 55px;
    text-align: center;
}

/* Avatar */
.avatar-wrap {
    display: inline-block;
    position: relative;
}

.avatar {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.8);

    box-shadow:
        0 0 25px rgba(255,255,255,.15);
}

/* Vòng sáng */
.avatar-wrap::before {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2);

    animation: pulse 2.5s infinite;
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
        opacity: .3;
    }

    50% {
        transform: scale(1.06);
        opacity: .8;
    }
}

/* Tên */
.name {
    margin-top: 20px;
    font-size: 30px;
    font-weight: bold;
}

/* Mạng xã hội */
.socials {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 18px;
}

/* Nút */
.social {
    width: 45px;
    height: 45px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;

    color: white;
    text-decoration: none;

    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.15);

    transition: .25s;
}

.social:hover {
    transform: translateY(-5px);
    background: rgba(255,255,255,.18);
}

.social svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
}

/* Đồng Nai */
.location {
    margin-top: 35px;

    display: inline-flex;
    align-items: center;
    gap: 7px;

    color: #999;
    font-size: 14px;
}

.dot {
    width: 7px;
    height: 7px;
    background: #ff4b32;
    border-radius: 50%;
}

/* Mobile */
@media(max-width:600px) {

    .container {
        padding-top: 45px;
    }

    .avatar {
        width: 105px;
        height: 105px;
    }

    .name {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<!-- Nền sao -->
<div id="stars"></div>

<!-- ?! -->
<div class="question q1">?!</div>
<div class="question q2">?!</div>
<div class="question q3">?!</div>
<div class="question q4">?!</div>

<div class="container">

    <!-- Avatar -->
    <div class="avatar-wrap">
        <img
            src="avatar.png"
            class="avatar"
            alt="Gia Huy"
        >
    </div>

    <!-- Tên -->
    <div class="name">
        Gia Huy
    </div>

    <!-- TikTok + Facebook -->
    <div class="socials">

        <!-- TikTok -->
        <a
            class="social"
            href="https://www.tiktok.com/@user._.heozw"
            target="_blank"
        >
            <svg viewBox="0 0 24 24">
                <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-3.77V2h-3.45v13.6a2.89 2.89 0 1 1-2.89-2.89c.3 0 .59.05.86.14V9.33a6.3 6.3 0 1 0 5.48 6.27V8.88a8.25 8.25 0 0 0 4.82 1.55V6.99a4.84 4.84 0 0 1-1.05-.3z"/>
            </svg>
        </a>

        <!-- Facebook -->
        <a
            class="social"
            href="https://www.facebook.com/share/1DpMJnZysN/?mibextid=wwXIfr"
            target="_blank"
        >
            <svg viewBox="0 0 24 24">
                <path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07c0 6.02 4.39 11 10.13 11.92v-8.43H7.08v-3.49h3.05V9.41c0-3.03 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.96h-1.51c-1.49 0-1.95.93-1.95 1.88v2.26h3.32l-.53 3.49h-2.79v8.43C19.61 23.07 24 18.09 24 12.07z"/>
            </svg>
        </a>

    </div>

    <!-- Địa điểm -->
    <div class="location">
        <span class="dot"></span>
        <span>Đồng Nai</span>
    </div>

</div>

<script>

/* Tạo sao */
const stars = document.getElementById("stars");

for (let i = 0; i < 180; i++) {

    const star = document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    stars.appendChild(star);
}

</script>

</body>
</html>
