<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gia Huy</title>

<style>

/* =========================
   CƠ BẢN
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}


/* =========================
   NỀN
========================= */

#background{
    position:fixed;
    inset:0;
    z-index:-10;

    background:
        radial-gradient(
            circle at 50% 25%,
            #161616 0%,
            #050505 45%,
            #000 100%
        );
}


/* =========================
   SAO
========================= */

.star{
    position:fixed;

    width:2px;
    height:2px;

    background:#fff;

    border-radius:50%;

    opacity:.7;

    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{

    from{
        opacity:.15;
    }

    to{
        opacity:1;
    }

}


/* =========================
   ?!
========================= */

.question{
    position:fixed;

    color:rgba(255,255,255,.35);

    font-size:22px;

    font-weight:bold;

    pointer-events:none;

    z-index:-1;

    animation:floating 5s ease-in-out infinite;
}

.q1{
    left:10%;
    top:15%;
}

.q2{
    right:12%;
    top:22%;

    animation-delay:1s;
}

.q3{
    left:7%;
    bottom:25%;

    animation-delay:2s;
}

.q4{
    right:9%;
    bottom:18%;

    animation-delay:3s;
}

.q5{
    left:18%;
    top:65%;

    animation-delay:1.5s;
}

@keyframes floating{

    0%,100%{
        transform:
            translateY(0)
            rotate(-5deg);
    }

    50%{
        transform:
            translateY(-18px)
            rotate(5deg);
    }

}


/* =========================
   CONTAINER
========================= */

.container{

    width:min(560px,92%);

    margin:auto;

    padding:
        70px
        0
        50px;

    text-align:center;
}


/* =========================
   AVATAR
========================= */

.avatar-wrap{

    position:relative;

    display:inline-block;

}

.avatar{

    width:120px;
    height:120px;

    object-fit:cover;

    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.75);

    display:block;

    box-shadow:
        0 0 30px
        rgba(255,255,255,.12);

}


/* vòng sáng avatar */

.avatar-wrap::before{

    content:"";

    position:absolute;

    inset:-7px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.2);

    animation:pulse 2.5s infinite;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
        opacity:.3;
    }

    50%{
        transform:scale(1.07);
        opacity:.7;
    }

}


/* =========================
   TÊN
========================= */

.name{

    margin-top:20px;

    font-size:30px;

    font-weight:bold;

    letter-spacing:1px;

}


/* =========================
   SOCIAL
========================= */

.socials{

    display:flex;

    justify-content:center;

    gap:12px;

    margin-top:18px;

    margin-bottom:25px;

}

.social{

    width:44px;
    height:44px;

    display:flex;

    justify-content:center;

    align-items:center;

    border-radius:50%;

    color:#fff;

    text-decoration:none;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.15);

    transition:.25s;

}

.social:hover{

    transform:
        translateY(-5px);

    background:
        rgba(255,255,255,.18);

}

.social svg{

    width:21px;
    height:21px;

    fill:currentColor;

}


/* =========================
   CARD
========================= */

.card{

    overflow:hidden;

    border-radius:18px;

    background:
        rgba(8,8,8,.9);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.75);

    backdrop-filter:
        blur(15px);

}


/* =========================
   BANNER
========================= */

.banner{

    width:100%;

    height:190px;

    object-fit:cover;

    display:block;

}


/* =========================
   THÔNG TIN
========================= */

.info{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:28px;

    padding:16px;

    color:#999;

    font-size:13px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

}

.info span{

    display:flex;

    align-items:center;

    gap:6px;

}


/* =========================
   MUSIC PLAYER
========================= */

.music{

    width:100%;

    display:flex;

    align-items:center;

    gap:12px;

    padding:
        15px
        18px;

    background:transparent;

}


/* ảnh nhạc */

.music-cover{

    width:58px;

    height:58px;

    object-fit:cover;

    flex-shrink:0;

    border-radius:3px;

}


/* phần giữa */

.music-info{

    flex:1;

    min-width:0;

    text-align:left;

}


/* tên bài */

.song{

    color:#fff;

    font-size:18px;

    font-weight:bold;

    font-family:monospace;

    margin-bottom:7px;

}


/* dòng thanh nhạc */

.music-line{

    display:flex;

    align-items:center;

    gap:8px;

}


/* thời gian */

.time{

    color:#fff;

    font-family:monospace;

    font-size:11px;

    width:28px;

    flex-shrink:0;

}


/* thanh */

.progress{

    height:7px;

    flex:1;

    background:#999;

    border-radius:10px;

    overflow:visible;

    cursor:pointer;

    position:relative;

}


/* phần đã chạy */

.progress-bar{

    height:100%;

    width:0%;

    background:#fff;

    border-radius:10px;

    position:relative;

}


/* nút tròn trên thanh */

.progress-bar::after{

    content:"";

    position:absolute;

    right:-6px;

    top:50%;

    transform:
        translateY(-50%);

    width:12px;

    height:12px;

    background:#fff;

    border-radius:50%;

}


/* nút chuyển bài */

.next{

    border:0;

    background:none;

    color:#fff;

    font-size:20px;

    cursor:pointer;

    padding:3px;

}


/* play */

.play{

    width:34px;

    height:34px;

    border:0;

    border-radius:50%;

    background:#fff;

    color:#000;

    font-size:12px;

    cursor:pointer;

    flex-shrink:0;

    transition:.2s;

}

.play:hover{

    transform:scale(1.08);

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .container{

        width:94%;

        padding-top:55px;

    }

    .avatar{

        width:105px;

        height:105px;

    }

    .name{

        font-size:27px;

    }

    .banner{

        height:160px;

    }

    .music{

        padding:
            13px 10px;

        gap:7px;

    }

    .music-cover{

        width:48px;

        height:48px;

    }

    .song{

        font-size:15px;

    }

    .time{

        font-size:9px;

        width:25px;

    }

    .play{

        width:32px;

        height:32px;

    }

}

</style>
</head>


<body>


<!-- =========================
     NỀN
========================= -->

<div id="background"></div>


<!-- ?! -->

<div class="question q1">?!</div>
<div class="question q2">?!</div>
<div class="question q3">?!</div>
<div class="question q4">?!</div>
<div class="question q5">?!</div>


<!-- =========================
     NỘI DUNG
========================= -->

<div class="container">


    <!-- AVATAR -->

    <div class="avatar-wrap">

        <img
            src="avatar.png"
            class="avatar"
            alt="Gia Huy"
        >

    </div>


    <!-- TÊN -->

    <div class="name">
        Gia Huy
    </div>


    <!-- =========================
         SOCIAL
    ========================= -->

    <div class="socials">


        <!-- TIKTOK -->

        <a
            class="social"
            href="https://www.tiktok.com/@user._.heozw"
            target="_blank"
            title="TikTok"
        >

            <svg viewBox="0 0 24 24">

                <path d="
                M19.59 6.69
                a4.83 4.83 0 0 1-3.77-3.77
                V2h-3.45v13.6
                a2.89 2.89 0 1 1-2.89-2.89
                c.3 0 .59.05.86.14
                V9.33
                a6.3 6.3 0 1 0 5.48 6.27
                V8.88
                a8.25 8.25 0 0 0 4.82 1.55
                V6.99
                a4.84 4.84 0 0 1-1.05-.3z
                "/>

            </svg>

        </a>


        <!-- FACEBOOK -->

        <a
            class="social"
            href="https://www.facebook.com/share/1DpMJnZysN/?mibextid=wwXIfr"
            target="_blank"
            title="Facebook"
        >

            <svg viewBox="0 0 24 24">

                <path d="
                M24 12.07
                C24 5.4 18.63 0 12 0
                S0 5.4 0 12.07
                c0 6.02 4.39 11
                10.13 11.92
                v-8.43
                H7.08
                v-3.49
                h3.05
                V9.41
                c0-3.03 1.79-4.7 4.53-4.7
                1.31 0 2.68.24 2.68.24
                v2.96
                h-1.51
                c-1.49 0-1.95.93-1.95 1.88
                v2.26
                h3.32
                l-.53 3.49
                h-2.79
                v8.43
                C19.61 23.07 24 18.09 24 12.07z
                "/>

            </svg>

        </a>


    </div>


    <!-- =========================
         CARD
    ========================= -->

    <div class="card">


        <!-- BANNER -->

        <img
            src="banner.jpg"
            class="banner"
            alt="Banner"
        >


        <!-- THÔNG TIN -->

        <div class="info">

            <span>
                👁 1,414
            </span>

            <span>
                📍 Đồng Nai
            </span>

        </div>


        <!-- =========================
             MUSIC
        ========================= -->

        <div class="music">


            <!-- COVER -->

            <img
                src="music-cover.jpg"
                class="music-cover"
                alt="anh duong."
            >


            <!-- THÔNG TIN NHẠC -->

            <div class="music-info">


                <div class="song">
                    anh duong.
                </div>


                <div class="music-line">


                    <!-- THỜI GIAN HIỆN TẠI -->

                    <span
                        class="time"
                        id="current"
                    >
                        0:00
                    </span>


                    <!-- THANH TIẾN TRÌNH -->

                    <div
                        class="progress"
                        id="progress"
                    >

                        <div
                            class="progress-bar"
                            id="progressBar"
                        ></div>

                    </div>


                    <!-- TỔNG THỜI GIAN -->

                    <span
                        class="time"
                        id="duration"
                    >
                        0:00
                    </span>


                </div>

            </div>


            <!-- PREVIOUS -->

            <button
                class="next"
                id="prev"
            >
                ‹
            </button>


            <!-- PLAY -->

            <button
                class="play"
                id="play"
            >
                ▶
            </button>


            <!-- NEXT -->

            <button
                class="next"
                id="next"
            >
                ›
            </button>


        </div>

    </div>

</div>


<!-- =========================
     AUDIO
========================= -->

<audio
    id="audio"
    src="music.mp3"
></audio>


<script>


/* =========================
   TẠO SAO
========================= */

for(let i=0;i<180;i++){

    const star =
        document.createElement("div");

    star.className="star";

    star.style.left =
        Math.random()*100+"%";

    star.style.top =
        Math.random()*100+"%";

    star.style.animationDelay =
        Math.random()*3+"s";

    document.body.appendChild(star);

}


/* =========================
   MUSIC
========================= */

const audio =
    document.getElementById("audio");

const play =
    document.getElementById("play");

const progress =
    document.getElementById("progress");

const progressBar =
    document.getElementById("progressBar");

const current =
    document.getElementById("current");

const duration =
    document.getElementById("duration");


/* =========================
   PLAY / PAUSE
========================= */

play.addEventListener(
    "click",
    () => {

        if(audio.paused){

            audio.play();

            play.textContent =
                "❚❚";

        }

        else{

            audio.pause();

            play.textContent =
                "▶";

        }

    }
);


/* =========================
   LOAD THỜI GIAN
========================= */

audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(audio.duration);

    }
);


/* =========================
   THANH CHẠY
========================= */

audio.addEventListener(
    "timeupdate",
    () => {

        if(!audio.duration)
            return;

        const percent =
            audio.currentTime /
            audio.duration *
            100;

        progressBar.style.width =
            percent+"%";

        current.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =========================
   CLICK ĐỂ TUA
========================= */

progress.addEventListener(
    "click",
    (event) => {

        if(!audio.duration)
            return;

        const rect =
            progress.getBoundingClientRect();

        const position =
            event.clientX -
            rect.left;

        const percent =
            position /
            rect.width;

        audio.currentTime =
            percent *
            audio.duration;

    }
);


/* =========================
   HẾT NHẠC
========================= */

audio.addEventListener(
    "ended",
    () => {

        play.textContent =
            "▶";

        progressBar.style.width =
            "0%";

        current.textContent =
            "0:00";

    }
);


/* =========================
   FORMAT TIME
========================= */

function formatTime(seconds){

    if(isNaN(seconds))
        return "0:00";

    const minutes =
        Math.floor(seconds/60);

    const secondsLeft =
        Math.floor(seconds%60)
        .toString()
        .padStart(2,"0");

    return (
        minutes +
        ":" +
        secondsLeft
    );

}


/* =========================
   NÚT PREV / NEXT
========================= */

document
    .getElementById("prev")
    .onclick = () => {

        audio.currentTime = 0;

    };


document
    .getElementById("next")
    .onclick = () => {

        audio.currentTime = 0;

        audio.play();

        play.textContent =
            "❚❚";

    };

</script>

</body>
</html>
